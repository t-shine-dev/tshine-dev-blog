{% extends 'blog/base.html' %}

{% block title %}Delete Post — Blogify{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="content-card text-center">
                <div class="delete-icon mb-3"><i class="bi bi-trash3"></i></div>
                <h4 class="mb-2">Delete Post</h4>
                <p class="text-muted">Are you sure you want to delete "<strong>{{ post.title }}</strong>"? This action cannot be undone.</p>
                <form method="POST" class="d-flex gap-3 justify-content-center mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Yes, Delete</button>
                    <a href="{{ post.get_absolute_url }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
